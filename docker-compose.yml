# /home/servidor/forsis-ai-agent/docker-compose.yml
#
# Forsis AI Agent — Fase 1
# Stack Python 3.12 / FastAPI. Un solo puerto publicado (8099/HTTPS).
# Secretos SIEMPRE en .env (modo 600, gitignored). Nunca en `environment:`.
#
# Redes externas: deben existir antes de `up`:
#   docker network ls | grep -E "ai-network|forsis-comunicaciones"

services:

  nginx:
    image: nginx:alpine
    container_name: forsis-ai-agent-nginx
    restart: unless-stopped
    ports:
      - "8099:443"                      # ÚNICO puerto publicado
    expose:
      - "8080"                          # listener plano interno (widget/webhooks), NO publicado
    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - default
      - forsis-comunicaciones
      - forsis-agent_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:       {cpus: "0.25", memory: 64M}
        reservations: {cpus: "0.05", memory: 32M}

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    image: forsis-ai-agent-app:local
    container_name: forsis-ai-agent-app
    restart: unless-stopped
    env_file: .env                      # TODOS los secretos viven aquí
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # --- Omniroute (gateway de modelos IA) — VERIFICADO Fase 1 ---
      OMNIROUTE_BASE_URL: http://host.docker.internal:20130/v1
      OMNIROUTE_MODEL: Forsis
      # --- BD propia del agente (PostgreSQL 16) ---
      DB_CONNECTION: postgresql
      DB_HOST: db
      DB_PORT: "5432"
      # --- Memoria vectorial compartida (pgvector, vía ai-network) ---
      MEMORY_DB_HOST: forsis-memory
      MEMORY_DB_PORT: "5432"
      # --- Canal conversacional ---
      MATTERMOST_URL: https://chatforsis.ddns.net
      # --- Fail-closed: sin allowlist, CERO acciones de escritura ---
      AGENT_WRITE_ALLOWLIST: ""
      AGENT_DRY_RUN_DEFAULT: "true"
      # --- Sandbox SQL de solo lectura (Sprint 3, R-1..R-5) ---
      # AGENT_RO_PASSWORD vive SOLO en .env (chmod 600, gitignored).
      AGENT_RO_USER: forsis_agent_ro
      SICRET_DB_HOST: host.docker.internal
      SICRET_DB_PORT: "3306"
      TRAFICO_DB_HOST: trafico-db
      TRAFICO_DB_PORT: "3306"
      # ATLAS: liberaciones y timbrado. Puerto publicado del host, no se
      # une a la red de atlas-db (superficie de red mínima).
      ATLAS_DB_HOST: host.docker.internal
      ATLAS_DB_PORT: "3311"
      AGENT_RO_USER_ATLAS: forsis_agent_ro
      AGENT_RO_PASSWORD_ATLAS: ${AGENT_RO_PASSWORD_ATLAS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Montaje de desarrollo: hace reflectivo el código sin rebuild.
      # DEBE quitarse antes del HITO GO/NO-GO para que la imagen sea la
      # única fuente de verdad (si no, la imagen y el código pueden divergir).
      - ./app:/app/app
      - forsis-ai-agent_storage:/app/storage
    # NOTA: `./knowledge` NO se monta aquí a propósito — contiene análisis
    # internos de seguridad que no deben existir en runtime (B-5).
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - ai-network
      - forsis-comunicaciones
      - forsis-agent_net
      - trafico-system_default      # solo lectura sobre trafico-db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:       {cpus: "1.5", memory: 1G}
        reservations: {cpus: "0.25", memory: 256M}

  db:
    image: postgres:16-alpine
    container_name: forsis-ai-agent-db
    restart: unless-stopped
    env_file: .env                      # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    # Sin `ports:` — la BD NO se publica al host, a propósito.
    # Depuración: docker compose exec db psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"
    command:
      - postgres
      - -c
      - max_connections=60
      - -c
      - shared_buffers=128MB
      - -c
      - work_mem=4MB
    volumes:
      - forsis-ai-agent_db_data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - default                         # SOLO default: aislada de ai-network y forsis-comunicaciones
    deploy:
      resources:
        limits:       {cpus: "0.5", memory: 512M}
        reservations: {cpus: "0.1", memory: 128M}

volumes:
  forsis-ai-agent_db_data:
  forsis-ai-agent_storage:

networks:
  default: {}
  ai-network:
    external: true
  forsis-comunicaciones:
    external: true
  forsis-agent_net:
    external: true
  # Red del compose de trafico-system. Se une SOLO para alcanzar `trafico-db`
  # en lectura (subred 172.29.0.0/16, grant SELECT acotado a 172.29.%).
  # No se modifica ningún archivo de trafico-system: es una red externa.
  trafico-system_default:
    external: true
