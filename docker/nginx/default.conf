# ==============================================================================
# Nginx Configuration for Forsis AI Agent (Python/FastAPI Stack)
# ==============================================================================

# Upstream para el servicio FastAPI/uvicorn
upstream fastapi_backend {
    server app:8000;
    keepalive 32;
}

# Redirección interna HTTP -> listener plano interno
server {
    listen 8080;
    server_name _;

    # Endpoint de healthcheck directo
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 130s;
        proxy_connect_timeout 10s;
    }
}

# Servidor HTTPS principal (publicado como 8099:443)
server {
    listen 443 ssl http2;
    server_name forsispr1.ddns.net _;

    # Certificados Let's Encrypt montados como solo lectura
    ssl_certificate /etc/letsencrypt/live/forsispr1.ddns.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/forsispr1.ddns.net/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25M;

    # Hardening de cabeceras de seguridad
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Healthcheck para Docker y monitores externos
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Deshabilitar acceso a archivos ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Servir archivos estáticos (UI web): pasan por proxy hacia FastAPI
    # (FastAPI tiene StaticFiles montado en /static/ui con caching adecuado)

    # Proxy hacia FastAPI/uvicorn en app:8000
    location / {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        
        # Timeouts aumentados para procesamiento LLM (60s llamada + overhead)
        proxy_read_timeout 130s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 130s;
        
        # Buffering para respuestas grandes (contexto conversacional)
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # WebSocket support (para futura UI reactiva si se implementa)
    location /ws {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }
}
